# regied example configuration
#
# A two-uplink host: a PPPoE session for traffic that has to be reachable from
# outside, and a DS-Lite tunnel for everything else. Policy routing picks
# between them by source address.
#
# The schema is described in docs/spec/. This file is the worked example that
# document refers to; every field used here appears in docs/spec/kinds.md.
#
# Every address below is reserved for documentation:
#   IPv4  192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24  (RFC 5737)
#   IPv6  2001:db8::/32                                   (RFC 3849)
#   MAC   00:00:5e:00:53:xx                               (RFC 7042)
# Private ranges are used on the LAN side, as a LAN would.
#
# No credential appears here, and no field in the schema could hold one.
# Credentials are named by the path of a file that holds them (ADR 0003).

apiVersion: net.unstable.cloud/v1alpha1
kind: Router
metadata:
  name: example

spec:
  # Kernel switches, applied at apply time and rolled back with everything
  # else. sourceValidation must stay off: policy routing makes return paths
  # asymmetric, and reverse path filtering drops exactly that traffic.
  global:
    ipForwarding: true
    synCookies: true
    logMartians: true
    sendRedirects: false
    receiveRedirects: false
    sourceValidation: false
    mssClamp: auto

  resources:
    # ------------------------------------------------------------------
    # Links
    # ------------------------------------------------------------------

    # The provider-facing link. It carries no address of its own: PPPoE runs
    # over it, and the DHCPv6 client asks for a prefix through it.
    - kind: Interface
      metadata: {name: wan}
      spec:
        ifname: eth0
        dhcpv6:
          useDNS: false
          prefixDelegation:
            prefixLength: 56
            rapidCommit: true
            duidFile: /etc/regied/secrets/dhcpv6-duid

    # The downstream segment. Its IPv6 address is derived from the delegated
    # prefix rather than written down, so the tunnel's local address, the
    # router advertisement and the DNS listening address all follow a prefix
    # change without an edit.
    - kind: Interface
      metadata: {name: lan}
      spec:
        ifname: br-lan
        mtu: 1500
        bridge:
          members: [eth1, eth2, eth3]
        addresses:
          - 192.168.10.1/24
          - fromDelegatedPrefix:
              interfaceRef: wan
              subnetID: 1
              token: "::1"
        routes:
          - destination: 172.16.0.0/16
            via: 192.168.10.10
          - destination: 2001:db8:0:2::/64
            via: 2001:db8:0:1::10
        ipv6:
          advertise:
            mode: slaac
            otherInformation: true
            validLifetime: 24h

    # ------------------------------------------------------------------
    # Uplinks
    # ------------------------------------------------------------------

    # Reachable from outside, so this is the uplink port forwards use.
    # defaultRoute.metric keeps it as a standby for the host's own traffic:
    # the tunnel below wins on metric.
    - kind: PPPoESession
      metadata: {name: pppoe0}
      spec:
        interfaceRef: wan
        userIDFile: /etc/regied/secrets/pppoe-user-id
        passwordFile: /etc/regied/secrets/pppoe-password
        mtu: 1454
        persist: true
        useDNS: false
        defaultRoute:
          install: true
          metric: 100

    # IPv4 over IPv6. The provider's AFTR translates addresses, so there is no
    # SourceNAT here and nothing can be published through it.
    - kind: DSLiteTunnel
      metadata: {name: dslite}
      spec:
        underlayRef: wan
        localAddressFrom:
          interfaceRef: lan
        aftrAddress: 2001:db8:ffff::11
        mtu: 1454
        ttl: 64
        defaultRoute:
          install: true
          metric: 0

    # ------------------------------------------------------------------
    # Which uplink a class of traffic leaves by
    #
    # Routing table numbers and firewall marks are not written here. regied
    # allocates them, installs the default route into the table, and emits the
    # routing policy rule that maps mark to table.
    #
    # excludeDestinations is what keeps traffic that must not leave from
    # leaving. It is also what makes hairpin work: the mark is set after
    # destination translation, so a LAN host reaching the published service
    # through the global address is already addressed to 192.168.10.20 by
    # then, matches the LAN exclusion, and stays local.
    # ------------------------------------------------------------------

    - kind: EgressRoutePolicy
      metadata: {name: upper-half-via-pppoe}
      spec:
        family: ipv4
        priority: 10
        egressRef: pppoe0
        sourceRanges:
          - 192.168.10.128-192.168.10.255
        excludeDestinations:
          - 192.168.10.0/24
          - 172.16.0.0/16

    - kind: EgressRoutePolicy
      metadata: {name: rest-via-dslite}
      spec:
        family: ipv4
        priority: 20
        egressRef: dslite
        sourceRanges:
          - 192.168.10.0/24
        excludeDestinations:
          - 192.168.10.0/24
          - 172.16.0.0/16

    # ------------------------------------------------------------------
    # NAT
    # ------------------------------------------------------------------

    # masquerade takes the address from the link as the packet leaves, so a
    # dynamically addressed uplink needs nothing written down.
    - kind: SourceNAT
      metadata: {name: masquerade-pppoe}
      spec:
        type: masquerade
        egressRef: pppoe0
        sourceRanges:
          - 192.168.10.0/24

    # No listening address: it is the uplink's, and it follows the uplink.
    # openFirewall defaults to true, so each of these also gets the accept
    # that lets the translated traffic through the wan-to-lan policy below.
    - kind: PortForward
      metadata: {name: https}
      spec:
        egressRef: pppoe0
        protocol: tcp
        port: 443
        target:
          address: 192.168.10.20
          port: 443

    - kind: PortForward
      metadata: {name: ssh}
      spec:
        egressRef: pppoe0
        protocol: tcp
        port: 10022
        target:
          address: 192.168.10.20
          port: 22

    # A range is one rule, not eleven.
    - kind: PortForward
      metadata: {name: mosh}
      spec:
        egressRef: pppoe0
        protocol: udp
        portRange: 60000-60010
        target:
          address: 192.168.10.30

    # ------------------------------------------------------------------
    # Firewall
    #
    # "wan" and "lan" are names of zones, not concepts the schema knows.
    # Traffic between a pair of zones with no policy is dropped.
    # ------------------------------------------------------------------

    - kind: FirewallZone
      metadata: {name: wan}
      spec:
        linkRefs: [wan, pppoe0, dslite]

    - kind: FirewallZone
      metadata: {name: lan}
      spec:
        linkRefs: [lan]

    # IPv6 has no NAT, so the wan-to-lan policy is the only thing standing
    # between the segment and the world. Hosts that should be reachable are
    # named here once and referred to from the rules.
    - kind: IPAddressSet
      metadata: {name: published-v6}
      spec:
        family: ipv6
        addresses:
          - 2001:db8:0:1::20
          - 2001:db8:0:1::30
        networks:
          - 2001:db8:0:2::/64

    - kind: FirewallPolicy
      metadata: {name: wan-to-self}
      spec:
        from: wan
        to: self
        defaultAction: drop
        logDefault: true
        rules:
          - name: icmp
            action: accept
            family: ipv4
            protocol: icmp
          - name: icmpv6
            action: accept
            family: ipv6
            protocol: icmpv6
          # Without this the DHCPv6 client never receives the delegation.
          - name: dhcpv6-client
            action: accept
            family: ipv6
            protocol: udp
            destinationPorts: [546]
          # Without this the DS-Lite tunnel never comes up: the encapsulated
          # packets arrive addressed to this host.
          - name: dslite-inbound
            action: accept
            family: ipv6
            protocol: ipip

    - kind: FirewallPolicy
      metadata: {name: wan-to-lan}
      spec:
        from: wan
        to: lan
        defaultAction: drop
        logDefault: true
        rules:
          - name: published-web
            action: accept
            family: ipv6
            protocol: tcp
            destinationAddressSetRefs: [published-v6]
            destinationPorts: [80, 443]
          - name: published-mosh
            action: accept
            family: ipv6
            protocol: udp
            destinationAddressSetRefs: [published-v6]
            destinationPorts: [60000-60010]

    - kind: FirewallPolicy
      metadata: {name: lan-to-wan}
      spec:
        from: lan
        to: wan
        defaultAction: accept

    - kind: FirewallPolicy
      metadata: {name: lan-to-self}
      spec:
        from: lan
        to: self
        defaultAction: accept

    # ------------------------------------------------------------------
    # Address handout and name resolution
    #
    # Both kinds render into one dnsmasq process. Router advertisement is not
    # here: it belongs to the interface, so there can only ever be one sender.
    # ------------------------------------------------------------------

    - kind: DHCPServer
      metadata: {name: lan}
      spec:
        interfaceRef: lan
        subnet: 192.168.10.0/24
        pool:
          start: 192.168.10.64
          end: 192.168.10.127
        leaseTime: 24h
        # Which side of 192.168.10.128 a mapping falls on decides which uplink
        # that host leaves by. See the policies above.
        staticMappings:
          - name: host-a
            macAddress: 00:00:5e:00:53:01
            address: 192.168.10.20
          - name: host-b
            macAddress: 00:00:5e:00:53:02
            address: 192.168.10.30
          - name: host-c
            macAddress: 00:00:5e:00:53:03
            address: 192.168.10.200
        ipv6:
          mode: stateless
          informationRefreshTime: 6h

    - kind: DNSForwarder
      metadata: {name: lan}
      spec:
        listenOn: [lan, loopback]
        cacheSize: 150
        upstreams:
          - 192.0.2.53
          - 2001:db8:ffff::53
        conditional:
          - domain: cluster.example
            servers: [172.16.0.53]
        staticHosts:
          # A public name answered with an internal address, so that clients
          # inside reach the service directly instead of going out and back.
          - name: service.example.com
            address: 192.168.10.20

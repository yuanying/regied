# regied example configuration
#
# A two-uplink host: a PPPoE session for traffic that has to be reachable from
# outside, and a DS-Lite tunnel for everything else. Policy routing picks
# between them by source address.
#
# The schema is described in docs/spec/. This file is the worked example that
# document refers to; every field used here appears in docs/spec/kinds.md.
#
# Every address below is reserved for documentation:
#   IPv4  192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24  (RFC 5737)
#   IPv6  2001:db8::/32                                   (RFC 3849)
#   MAC   00:00:5e:00:53:xx                               (RFC 7042)
# Private ranges are used on the LAN side, as a LAN would.
#
# No credential appears here, and no field in the schema could hold one.
# Credentials are named by the path of a file that holds them (ADR 0003).

apiVersion: net.unstable.cloud/v1alpha1
kind: NetworkConfig
metadata:
  name: example

spec:
  # Kernel switches, applied at apply time and rolled back with everything
  # else. sourceValidation must stay off: policy routing makes return paths
  # asymmetric, and reverse path filtering drops exactly that traffic.
  global:
    ipForwarding: true
    synCookies: true
    logMartians: true
    sendRedirects: false
    receiveRedirects: false
    sourceValidation: false
    mssClamp: auto

  resources:
    # ------------------------------------------------------------------
    # Links
    # ------------------------------------------------------------------

    # The provider-facing link. It carries no address of its own: PPPoE runs
    # over it, and the DHCPv6 client asks for a prefix through it.
    - kind: Interface
      metadata: {name: wan}
      spec:
        ifname: eth0
        dhcpv6:
          useDNS: false
          prefixDelegation:
            prefixLength: 56
            rapidCommit: true
            duidFile: /etc/regied/secrets/dhcpv6-duid
            iaid: 0

    # The downstream segment. Its IPv6 address is derived from the delegated
    # prefix rather than written down, so the tunnel's local address, the
    # router advertisement and the DNS listening address all follow a prefix
    # change without an edit.
    - kind: Interface
      metadata: {name: lan}
      spec:
        ifname: br-lan
        mtu: 1500
        bridge:
          members: [eth1, eth2, eth3]
        addresses:
          - 192.168.10.1/24
          - fromDelegatedPrefix:
              interfaceRef: wan
              subnetID: 1
              token: "::1"
        routes:
          - destination: 172.16.0.0/16
            via: 192.168.10.10
          - destination: 2001:db8:0:2::/64
            via: 2001:db8:0:1::10
        ipv6:
          advertise:
            mode: slaac
            otherInformation: true
            # The lifetimes apply to a prefix written here as a literal. This
            # interface advertises only its delegated prefix, whose lifetimes
            # come from the delegation, so regied says this one is not applied.
            validLifetime: 24h

    # ------------------------------------------------------------------
    # Uplinks
    # ------------------------------------------------------------------

    # Reachable from outside, so this is the uplink port forwards use.
    # defaultRoute.metric keeps it as a standby for the host's own traffic:
    # the tunnel below wins on metric.
    - kind: PPPoESession
      metadata: {name: pppoe0}
      spec:
        interfaceRef: wan
        userIDFile: /etc/regied/secrets/pppoe-user-id
        passwordFile: /etc/regied/secrets/pppoe-password
        mtu: 1454
        persist: true
        useDNS: false
        defaultRoute:
          install: true
          metric: 100

    # IPv4 over IPv6. The provider's AFTR translates addresses, so there is no
    # SourceNAT here and nothing can be published through it.
    #
    # The AFTR is named rather than addressed: the name is what the provider
    # publishes, the addresses behind it are theirs to change. It is resolved
    # once, at apply time, and it has to resolve over IPv6 -- this tunnel is
    # what carries IPv4, so a resolver reachable only over IPv4 could not be
    # asked. The DNSForwarder below has an IPv6 upstream for that reason.
    - kind: DSLiteTunnel
      metadata: {name: dslite}
      spec:
        underlayRef: wan
        # The address the tunnel sends from is taken from an interface rather
        # than written down. systemd 257 can only take it from the link the
        # tunnel is stacked on, so naming another interface is reported and the
        # tunnel sends from the underlay's global address (ADR 0011).
        localAddressFrom:
          interfaceRef: lan
        aftrHost: aftr.example.net
        mtu: 1454
        ttl: 64
        defaultRoute:
          install: true
          metric: 0

    # ------------------------------------------------------------------
    # Which uplink a class of traffic leaves by
    #
    # Routing table numbers and firewall marks are not written here. regied
    # allocates them, installs the default route into the table, and emits the
    # routing policy rule that maps mark to table.
    #
    # excludeDestinations is what keeps traffic that must not leave from
    # leaving. It is also what makes hairpin work: the mark is set after
    # destination translation, so a LAN host reaching the published service
    # through the global address is already addressed to 192.168.10.200 by
    # then, matches the LAN exclusion, and stays local.
    # ------------------------------------------------------------------

    - kind: EgressRoutePolicy
      metadata: {name: upper-half-via-pppoe}
      spec:
        family: ipv4
        priority: 10
        egressRef: pppoe0
        sourceRanges:
          - 192.168.10.128-192.168.10.255
        excludeDestinations:
          - 192.168.10.0/24
          - 172.16.0.0/16

    - kind: EgressRoutePolicy
      metadata: {name: rest-via-dslite}
      spec:
        family: ipv4
        priority: 20
        egressRef: dslite
        sourceRanges:
          - 192.168.10.0/24
        excludeDestinations:
          - 192.168.10.0/24
          - 172.16.0.0/16

    # ------------------------------------------------------------------
    # NAT
    # ------------------------------------------------------------------

    # masquerade takes the address from the link as the packet leaves, so a
    # dynamically addressed uplink needs nothing written down.
    - kind: SourceNAT
      metadata: {name: masquerade-pppoe}
      spec:
        type: masquerade
        egressRef: pppoe0
        sourceRanges:
          - 192.168.10.0/24

    # No listening address: it is the uplink's, and it follows the uplink.
    # openFirewall defaults to true, so each of these also gets the accept
    # that lets the translated traffic through the wan-to-lan policy below.
    #
    # The targets happen to be in the range the policy above sends out this
    # uplink, but nothing depends on that. A connection that arrives here is
    # marked with the uplink it arrived on and its reply leaves by the same
    # uplink, whatever the policies say about the target's own traffic. A
    # target below 192.168.10.128 would be reached and would answer just the
    # same; only what it starts itself would leave by the tunnel.
    - kind: PortForward
      metadata: {name: https}
      spec:
        egressRef: pppoe0
        protocol: tcp
        port: 443
        target:
          address: 192.168.10.200
          port: 443

    - kind: PortForward
      metadata: {name: ssh}
      spec:
        egressRef: pppoe0
        protocol: tcp
        port: 10022
        target:
          address: 192.168.10.200
          port: 22

    # A range is one rule, not eleven.
    - kind: PortForward
      metadata: {name: mosh}
      spec:
        egressRef: pppoe0
        protocol: udp
        portRange: 60000-60010
        target:
          address: 192.168.10.210

    # ------------------------------------------------------------------
    # DNS records that follow the uplink's address
    #
    # No address is written here either. A record names the uplink it
    # follows, the way SourceNAT and PortForward do, and the resident
    # process writes the record when that uplink's address is not what it
    # last wrote there. Stopping regied stops the updates.
    #
    # One resource per zone: the API token is what binds to a zone, and a
    # token scoped to one zone is the smaller credential. The token is
    # named by the path of a file holding it, and its content never
    # appears in a dry-run, a diff, a log line, or a turn's report.
    #
    # Records are created when they are not there and updated when they
    # are. Nothing is ever deleted, and an existing record's other fields
    # -- a comment somebody wrote on it -- are left alone.
    # ------------------------------------------------------------------

    - kind: DNSRecordSet
      metadata: {name: example-com}
      spec:
        provider: cloudflare
        zone: example.com
        apiTokenFile: /etc/regied/secrets/cloudflare-example-com
        records:
          # The apex and the wildcard follow the same uplink and want the
          # same properties, so they are one entry over two names. Each
          # name is its own record at the provider.
          #
          # egressRef is on the record and not on the zone: which uplink a
          # name follows is a property of the name. It has to be the PPPoE
          # session -- nothing can be published through the tunnel, so a
          # record naming it is a validation error.
          - names: [example.com, "*.example.com"]
            type: A
            egressRef: pppoe0
            proxied: false
            # automatic hands the choice to the provider. It is a declared
            # value, and not the same as leaving the field out.
            ttl: automatic

    - kind: DNSRecordSet
      metadata: {name: example-net}
      spec:
        provider: cloudflare
        zone: example.net
        # A second zone with a token of its own. Naming one token from
        # both zones is allowed, and is where a deployment usually starts;
        # narrowing it later changes this path and nothing else.
        apiTokenFile: /etc/regied/secrets/cloudflare-example-net
        records:
          # Proxied: the name resolves to the provider's own addresses, and
          # the address written here is where the provider sends the
          # traffic on. A proxied record's TTL belongs to the provider, so
          # writing one here is a validation error.
          - names: [example.net, "*.example.net"]
            type: A
            egressRef: pppoe0
            proxied: true

    # ------------------------------------------------------------------
    # Firewall
    #
    # "wan" and "lan" are names of zones, not concepts the schema knows.
    # Traffic between a pair of zones with no policy is dropped.
    # ------------------------------------------------------------------

    - kind: FirewallZone
      metadata: {name: wan}
      spec:
        linkRefs: [wan, pppoe0, dslite]

    - kind: FirewallZone
      metadata: {name: lan}
      spec:
        linkRefs: [lan]

    # IPv6 has no NAT, so the wan-to-lan policy is the only thing standing
    # between the segment and the world. Hosts that should be reachable are
    # named here once and referred to from the rules.
    - kind: IPAddressSet
      metadata: {name: published-v6}
      spec:
        family: ipv6
        addresses:
          - 2001:db8:0:1::200
          - 2001:db8:0:1::210
        networks:
          - 2001:db8:0:2::/64

    - kind: FirewallPolicy
      metadata: {name: wan-to-self}
      spec:
        from: wan
        to: self
        defaultAction: drop
        logDefault: true
        rules:
          - name: icmp
            action: accept
            family: ipv4
            protocol: icmp
          - name: icmpv6
            action: accept
            family: ipv6
            protocol: icmpv6
          # Without this the DHCPv6 client never receives the delegation.
          - name: dhcpv6-client
            action: accept
            family: ipv6
            protocol: udp
            destinationPorts: [546]
          # Without this the DS-Lite tunnel never comes up: the encapsulated
          # packets arrive addressed to this host.
          - name: dslite-inbound
            action: accept
            family: ipv6
            protocol: ipip

    - kind: FirewallPolicy
      metadata: {name: wan-to-lan}
      spec:
        from: wan
        to: lan
        defaultAction: drop
        logDefault: true
        rules:
          - name: published-web
            action: accept
            family: ipv6
            protocol: tcp
            destinationAddressSetRefs: [published-v6]
            destinationPorts: [80, 443]
          - name: published-mosh
            action: accept
            family: ipv6
            protocol: udp
            destinationAddressSetRefs: [published-v6]
            destinationPorts: [60000-60010]

    - kind: FirewallPolicy
      metadata: {name: lan-to-wan}
      spec:
        from: lan
        to: wan
        defaultAction: accept

    - kind: FirewallPolicy
      metadata: {name: lan-to-self}
      spec:
        from: lan
        to: self
        defaultAction: accept

    # ------------------------------------------------------------------
    # Address handout and name resolution
    #
    # Both kinds render into one dnsmasq process. Router advertisement is not
    # here: it belongs to the interface, so there can only ever be one sender.
    # ------------------------------------------------------------------

    - kind: DHCPServer
      metadata: {name: lan}
      spec:
        interfaceRef: lan
        subnet: 192.168.10.0/24
        pool:
          start: 192.168.10.64
          end: 192.168.10.127
        leaseTime: 24h
        # Which side of 192.168.10.128 a mapping falls on decides which uplink
        # that host leaves by. See the policies above.
        staticMappings:
          # host-a and host-b are published from outside, so they sit above
          # 192.168.10.128 and leave by the PPPoE uplink the forwards are on.
          - name: host-a
            macAddress: 00:00:5e:00:53:01
            address: 192.168.10.200
          - name: host-b
            macAddress: 00:00:5e:00:53:02
            address: 192.168.10.210
          - name: host-c
            macAddress: 00:00:5e:00:53:03
            address: 192.168.10.20
        ipv6:
          mode: stateless
          informationRefreshTime: 6h

    - kind: DNSForwarder
      metadata: {name: lan}
      spec:
        # loopback: the host itself asks this dnsmasq. regied points
        # systemd-resolved at it through every addressed link's .network
        # file, so refusing the providers' resolvers above (useDNS: false)
        # leaves the host with a resolver (ADR 0018).
        listenOn: [lan, loopback]
        cacheSize: 150
        upstreams:
          - 192.0.2.53
          - 2001:db8:ffff::53
        conditional:
          - domain: cluster.example
            servers: [172.16.0.53]
        staticHosts:
          # A public name answered with an internal address, so that clients
          # inside reach the service directly instead of going out and back.
          - name: service.example.com
            address: 192.168.10.200

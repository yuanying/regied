# Generated by regied. Do not edit: every apply rewrites this file.
#
# PPPoESession/pppoe0. No credential appears here. The account name and the
# password are in a second options file, given to pppd alongside this one.

plugin rp-pppoe.so
nic-eth0

# The link is named after the resource, so a redial does not rename it and
# nothing that points at it has to follow.
ifname pppoe0
linkname pppoe0

mtu 1454
mru 1454

noauth
noipdefault
noipv6

defaultroute
defaultroute-metric 100

# Redial when the session drops, and notice that it dropped: without LCP
# echoes a session that died silently is never redialled.
persist
holdoff 5
maxfail 0
lcp-echo-interval 10
lcp-echo-failure 5

# The DHCPv6 client asking for the delegated prefix runs on the same interface.
# The ip-up hook asks it to solicit again when the session comes back from
# another access concentrator, and keeps the one it came up from here.
set REGIED_PD_INTERFACE=eth0
set REGIED_CONCENTRATOR_RECORD=/run/regied/ppp/pppoe0.concentrator

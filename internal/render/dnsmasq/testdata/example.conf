# Generated by regied. Do not edit: every apply rewrites this file.
#
# One dnsmasq serves every DHCPServer and DNSForwarder on the host. Router
# advertisement is not here -- the interface sends it, so there is only ever
# one sender.

# The links to answer on. bind-dynamic keeps dnsmasq off every other link,
# the uplink included, while still coping with one that appears later.
bind-dynamic
interface=br-lan
interface=lo

# DNS. The upstreams are declared, so the host resolver is not consulted: on
# this host it is this process, and asking it would be a loop. Names come from
# the configuration alone and not from /etc/hosts, and neither an unqualified
# name nor a private reverse lookup is sent upstream.
no-resolv
no-poll
no-hosts
domain-needed
bogus-priv
cache-size=150

# DNSForwarder/lan
server=192.0.2.53
server=2001:db8:ffff::53
server=/cluster.example/172.16.0.53
host-record=service.example.com,192.168.10.200

# DHCP
dhcp-authoritative
dhcp-leasefile=/var/lib/regied/dnsmasq.leases

# DHCPServer/lan
dhcp-range=set:lan,192.168.10.64,192.168.10.127,255.255.255.0,24h
dhcp-option=tag:lan,option:router,192.168.10.1
dhcp-option=tag:lan,option:dns-server,192.168.10.1
dhcp-host=00:00:5e:00:53:01,192.168.10.200,host-a
dhcp-host=00:00:5e:00:53:02,192.168.10.210,host-b
dhcp-host=00:00:5e:00:53:03,192.168.10.20,host-c
dhcp-range=set:lan-v6,::,constructor:br-lan,static
dhcp-option=tag:lan-v6,option6:information-refresh-time,6h
